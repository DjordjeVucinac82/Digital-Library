spring:
  application:
    name: worker

  # Activate 'aws' profile by default (SQS + MySQL).
  # docker-compose overrides this with SPRING_PROFILES_ACTIVE=local (RabbitMQ + PostgreSQL).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:aws}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
