name: CD — Deploy to AWS EKS

on:
  push:
    branches:
      - main   # auto-deploys to dev on every merge
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com

jobs:

  # ─── Build Docker images and push to ECR ────────────────────────────────────
  build-and-push:
    name: Build & push Docker images to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push compressor
        uses: docker/build-push-action@v6
        with:
          context: ./compressor
          push: true
          tags: ${{ env.ECR_REGISTRY }}/digital-library/compressor:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ env.ECR_REGISTRY }}/digital-library/worker:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/digital-library/frontend:${{ github.sha }}

  # ─── Deploy to EKS via kubectl ───────────────────────────────────────────────
  deploy:
    name: Deploy to EKS (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Downloads kubeconfig for the target EKS cluster
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name digital-library-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }}

      # Update the image tag for each deployment.
      # kubectl set image only updates the image — all other manifest fields stay as-is.
      - name: Update image tags
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.ECR_REGISTRY }}/digital-library/frontend:${{ env.IMAGE_TAG }} \
            -n digital-library

          kubectl set image deployment/compressor \
            compressor=${{ env.ECR_REGISTRY }}/digital-library/compressor:${{ env.IMAGE_TAG }} \
            -n digital-library

          kubectl set image deployment/worker \
            worker=${{ env.ECR_REGISTRY }}/digital-library/worker:${{ env.IMAGE_TAG }} \
            -n digital-library

      # Wait for rolling update to complete — fails the pipeline if pods don't become ready
      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/frontend \
            -n digital-library --timeout=300s

          kubectl rollout status deployment/compressor \
            -n digital-library --timeout=300s

          kubectl rollout status deployment/worker \
            -n digital-library --timeout=300s

      # Print pod status and ALB URL for quick verification
      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n digital-library

          echo "=== ALB URL ==="
          kubectl get ingress frontend -n digital-library \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
