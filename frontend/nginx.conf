server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all routes so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the compressor service (avoids CORS in local Docker setup)
    location /api/ {
        proxy_pass http://compressor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
