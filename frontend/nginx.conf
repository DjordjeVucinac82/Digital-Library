server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all routes so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the compressor service (avoids CORS in local Docker setup)
    location /api/ {
        proxy_pass http://compressor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # nginx stub_status — reachable only from localhost (nginx-prometheus-exporter sidecar)
    # The sidecar polls this and re-exposes the data as Prometheus metrics on port 9113
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
