spring:
  application:
    name: compressor

  # Activate 'aws' profile by default (SQS + remote broker).
  # docker-compose overrides this with SPRING_PROFILES_ACTIVE=local to use RabbitMQ.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:aws}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8081

# Exposes /actuator/health for ALB health checks and /actuator/metrics for CloudWatch
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
