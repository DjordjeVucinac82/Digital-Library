# ServiceAccount for worker pods.
#
# BEFORE APPLYING: replace REPLACE_WITH_WORKER_IRSA_ARN with the actual ARN.
# Get it: terraform -chdir=infra/environments/dev output worker_irsa_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: digital-library
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_WORKER_IRSA_ARN
