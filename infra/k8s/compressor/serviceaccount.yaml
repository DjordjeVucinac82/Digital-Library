# ServiceAccount for compressor pods.
#
# The IRSA annotation links this ServiceAccount to the compressor IAM role,
# granting pods the ability to send messages to SQS without storing credentials.
#
# BEFORE APPLYING: replace REPLACE_WITH_COMPRESSOR_IRSA_ARN with the actual ARN.
# Get it: terraform -chdir=infra/environments/dev output compressor_irsa_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compressor
  namespace: digital-library
  annotations:
    # IRSA — the EKS OIDC provider validates this and allows the pod to assume the role
    eks.amazonaws.com/role-arn: REPLACE_WITH_COMPRESSOR_IRSA_ARN
